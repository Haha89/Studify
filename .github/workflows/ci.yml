name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Windows, like development: opencv-python needs extra system libraries on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
