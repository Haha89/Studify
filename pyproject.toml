[project]
name = "legome"
version = "0.1.0"
description = "Turn any image into a LEGO mosaic build guide."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.1",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]

[project.scripts]
legome = "legome.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legome"]

[tool.uv]
# Use the OS certificate store: needed behind TLS-inspecting proxies.
system-certs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Canvas.plot() calls plt.show(); harmless under the headless Agg backend.
    "default:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
