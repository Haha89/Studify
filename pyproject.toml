[project]
name = "studify"
version = "0.1.0"
description = "Turn any image into a LEGO mosaic build guide."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.1",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
depth = ["onnxruntime>=1.18"]
web = [
    "dash>=2.17",
    "dash-mantine-components>=1.0",
    "onnxruntime>=1.18",
    "waitress>=3.0",
]

[project.scripts]
studify = "studify.cli:main"
studify-web = "studify.web.app:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studify"]

[tool.uv]
# Use the OS certificate store: needed behind TLS-inspecting proxies.
system-certs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:dash: Dash ships a pytest plugin (browser testing) we do not use, and which
# trips the warnings-as-errors filter below on recent pytest.
# -n auto: one worker per CPU (pytest-xdist), about 3x faster here. Each test keeps its
# files in its own tmp_path, so they don't share state. Use -n0 to debug a single test.
addopts = "-q -p no:dash -n auto"
filterwarnings = [
    "error",
    # Canvas.plot() calls plt.show(); harmless under the headless Agg backend.
    "default:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Whole sentences of the interface, which read better unbroken in their translations.
"studify/web/app.py" = ["E501"]
"studify/web/i18n.py" = ["E501"]
